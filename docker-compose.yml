version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: animal_health_postgis
    restart: always
    environment:
      POSTGRES_DB: animal_surveillance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animal_surveillance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
